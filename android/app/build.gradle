plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin" // Flutter Gradle Plugin
}

android {
    namespace = "com.example.financial_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // Use VERSION_1_8 for Java 1.8
        targetCompatibility JavaVersion.VERSION_17 // Use VERSION_1_8 for Java 1.8
    }

    kotlinOptions {
        jvmTarget = '17' // Use '1.8' for Java 1.8
    }

    // JVM Toolchain
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17) // Use 1.8 for Java 1.8
        }
    }

    defaultConfig {
        applicationId = "com.example.financial_app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }
}

flutter {
    source = "../.." // Adjust path as needed
}
